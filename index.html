<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HatDat</title>
    <style>
        /* HatDat Centralized Design System */
        * { 
          margin: 0; 
          padding: 0; 
          box-sizing: border-box; 
        }

        :root {
          --gold: #d4a04a;          
          --gold-light: #e8c87a;    
          --cream: #f5e6d3;         
          --cream-dim: #d4c8b8;     
          --teal: #6b9e8a;          
          --teal-light: #8bb8a6;    
          --bg: #0f0c0a;            
          --surface: #1a1410;       
          --card: #221c18;          
          --border: #332a24;        
          --text-dim: #6b5f55;      
          --text-muted: #a09286;    
          --text-light: #e8ddd0;    
          --white: #faf3e8;         
          --green: var(--teal);          
          --purple: var(--gold-light);   
        }

        body {
          background-color: var(--bg);
          color: var(--text-light);
          font-family: sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        .container {
          max-width: 500px;
          width: 100%;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 40px;
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .title {
          color: var(--gold);
          font-size: 18px;
          font-weight: bold;
          text-align: center;
          margin-bottom: 20px;
          letter-spacing: 0.5px;
        }

        .player-wrapper {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 12px;
          overflow: hidden;
          padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Audio Feed</div>
        <div class="player-wrapper">
           <iframe width="100%" height="400" src="https://player-widget.mixcloud.com/widget/iframe/?autoplay=1&feed=%2Fcalgaeycratoz%2Fdarins-bud-budder%2F" frameborder="0" allow="encrypted-media; fullscreen; autoplay; idle-detection; speaker-selection; web-share;" ></iframe>
        </div>
      
</body>
</html>
