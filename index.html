  <!-- Structured data -->

  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: rgba(15, 20, 30, 0.58);
      --surface-border: rgba(255, 255, 255, 0.18);
      --card-bg: rgba(22, 26, 39, 0.7);
      --gold: #d4a04a;
      --gold-light: #e8c87a;
      --teal: #38bdf8;
      --teal-light: #7dd3fc;
      --text-light: #f8fafc;
      --text-muted: #cbd5e1;
      --ok: #34d399;
      --bad: #f87171;
      --draw: 7s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text-light);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Cinematic Background Video Layer */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(1.05);
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(9, 10, 15, 0.15) 0%, rgba(9, 10, 15, 0.55) 100%);
      backdrop-filter: blur(1px);
    }

    .container {
      background-color: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @media (max-width: 420px) {
      .container {
        padding: 1.75rem 1.25rem;
      }
    }

    .kicker {
      color: var(--text-light);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      margin: 0;
    }

    .rule {
      border: 0;
      height: 1px;
      width: 80%;
      margin: 0.75rem auto 0.5rem;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold) 20%,
        var(--teal) 80%,
        transparent
      );
    }

    /* Hero wordmark */
    h1 {
      color: var(--gold);
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 4.75rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    h1 .hat {
      color: var(--text-light);
    }

    h1 .dat {
      color: var(--teal);
    }

    h1 .tm {
      color: var(--gold);
      font-size: 0.35em;
      vertical-align: super;
    }

    h1 .paws {
      font-size: 0.7em;
    }

    /* Taglines slide in gradually */
    .subtitle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25em;
      width: 100%;
      overflow: hidden;
      font-weight: 700;
      font-size: clamp(0.65rem, 3.2vw, 0.95rem);
      letter-spacing: 0.12em;
      margin: 0.5rem 0 1rem;
      box-sizing: border-box;
    }

    .tagline-line {
      display: block;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      transform: translateX(100%);
      animation: tagline-enter 1.2s ease-out forwards;
    }

    .tagline-red {
      color: var(--bad);
      animation-delay: 0.5s;
    }

    .tagline-gold {
      color: var(--gold-light);
      animation-delay: 2.2s;
    }

    .tagline-green {
      color: var(--teal-light);
      animation-delay: 4s;
    }

    .tagline-white {
      color: var(--text-light);
      animation-delay: 5.8s;
    }

    @keyframes tagline-enter {
      to {
        transform: translateX(0);
      }
    }

    p {
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Main call to action */
    .btn-teal {
      display: inline-block;
      background-color: var(--teal);
      color: #0b0f19;
      padding: 0.75rem 1.5rem;
      min-height: 48px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-weight: bold;
      margin-top: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      width: 100%;
    }

    .btn-teal:hover,
    .btn-teal:focus-visible {
      background-color: #0ea5e9;
      color: var(--text-light);
    }

    .btn-teal:active {
      transform: scale(0.99);
    }

    .btn-teal:disabled {
      opacity: 0.6;
      cursor: wait;
      box-shadow: none;
    }

    :focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 2px;
    }

    /* Pop-up dialog */
    dialog {
      background-color: rgba(18, 24, 36, 0.95);
      color: var(--text-light);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 0;
      overflow: visible;
      max-height: calc(100vh - 2rem);
      max-width: 420px;
      width: 88%;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    dialog[open] {
      display: flex;
      flex-direction: column;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    .dlg-body {
      padding: 2rem 1.5rem 1.5rem;
      overflow-y: auto;
      min-height: 0;
    }

    dialog .paw {
      font-size: 2.2rem;
      line-height: 1;
    }

    dialog h2 {
      color: var(--text-light);
      margin: 0.5rem 0 0.25rem;
      font-size: 1.4rem;
    }

    dialog h2 .hat {
      color: var(--text-light);
    }

    dialog h2 .dat {
      color: var(--teal);
    }

    dialog h2 .tm {
      color: var(--gold);
      font-size: 0.6em;
      vertical-align: super;
    }

    dialog .tagline {
      color: var(--teal-light);
      font-weight: 700;
      margin: 0 0 1rem;
    }

    dialog p {
      color: var(--text-muted);
      margin: 0 0 0.75rem;
    }

    dialog .btn-teal {
      width: 100%;
      margin-top: 0.75rem;
    }

    .btn-close {
      min-height: 44px;
      padding: 0.6rem 1.2rem;
      margin-top: 0.75rem;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-close:hover {
      color: var(--text-light);
      border-color: var(--text-light);
    }

    /* Waitlist form */
    .wl {
      text-align: left;
      margin-top: 1rem;
      border-top: 1px solid var(--surface-border);
      padding-top: 1rem;
    }

    .wl label {
      display: block;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
    }

    .wl input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      font: inherit;
      background: var(--card-bg);
      color: var(--text-light);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
    }

    .wl input[type="email"]::placeholder {
      color: var(--text-muted);
    }

    .wl input[type="email"]:focus {
      border-color: var(--teal);
      outline: none;
    }

    .wl .consent {
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
      margin-top: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .wl .consent input {
      margin-top: 0.15rem;
      width: 18px;
      height: 18px;
      flex: none;
      accent-color: var(--teal);
    }

    .wl .hp {
      position: absolute;
      left: -9999px;
    }

    .wl .cf-turnstile {
      margin-top: 0.75rem;
    }

    .wl .fine {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
      text-align: center;
    }

    #wl-msg {
      margin-top: 0.75rem;
      font-weight: 700;
      text-align: center;
      font-size: 0.9rem;
    }

    #wl-msg.ok {
      color: var(--ok);
    }

    #wl-msg.bad {
      color: var(--bad);
    }

    /* Animated border */
    .frame {
      position: absolute;
      top: -1px;
      left: -1px;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    .frame-line {
      fill: none;
      stroke-width: 2.5px;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: frame-draw var(--draw) cubic-bezier(0.6, 0, 0.3, 1) forwards;
    }

    .frame-left {
      stroke: var(--gold);
    }

    .frame-right {
      stroke: var(--teal);
    }

    @keyframes frame-draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .spark {
      position: absolute;
      top: auto;
      bottom: 0;
      left: 50%;
      width: 16px;
      height: 16px;
      margin: 0 0 -8px -8px;
      border-radius: 50%;
      pointer-events: none;
      background: var(--gold-light);
      box-shadow: 
        0 0 10px 4px var(--gold-light),
        0 0 28px 10px rgba(212, 160, 74, 0.65);
      opacity: 0;
      transform: scale(0);
      animation: spark-pop 1.2s ease-out var(--draw) forwards;
    }

    .spark::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--gold-light);
      animation: spark-ring 1.2s ease-out var(--draw) forwards;
    }

    @keyframes spark-pop {
      0% { opacity: 0; transform: scale(0); }
      30% { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(0.4); }
    }

    @keyframes spark-ring {
      0% { opacity: 0.9; transform: scale(0.3); }
      100% { opacity: 0; transform: scale(3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-teal { transition: none; }
      .tagline-line { animation: none; transform: translateX(0); }
      .frame-line { animation: none; stroke-dashoffset: 0; }
      .spark { display: none; }
    }
  </style>
</head>
<body>

  <!-- Cinematic Background Video Loop -->
  <div class="video-background">
    <video autoplay loop muted playsinline>
      <source src="reunion.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <main class="container">
    <p class="kicker">FREE SERVICE - LOST &amp; FOUND PET SIGHTING TOOL</p>
    <hr class="rule">
    <h1>
      <span class="paws" aria-hidden="true">🐾</span>
      <span class="hat">Hat</span><span class="dat">Dat</span><span class="tm">™</span>
    </h1>
    <div class="subtitle" aria-label="Spot any lost animal. Upload the photo. Activate real-time mapping. Get them home safely.">
      <span class="tagline-line tagline-red">SPOT ANY LOST ANIMAL</span>
      <span class="tagline-line tagline-gold">UPLOAD THE PHOTO</span>
      <span class="tagline-line tagline-green">ACTIVATE REAL-TIME MAPPING</span>
      <span class="tagline-line tagline-white">GET THEM HOME SAFELY</span>
    </div>
    <button type="button" class="btn-teal" id="open-soon">
      GET LAUNCH UPDATES
    </button>
  </main>

  <dialog id="soon" aria-labelledby="soon-title">
    <div class="dlg-body">
      <div class="paw" aria-hidden="true">🐾</div>
      <h2 id="soon-title">
        <span class="hat">Hat</span><span class="dat">Dat</span><span class="tm">™</span>
        Pet Rescue
      </h2>
      <p class="tagline">Almost ready. Join the list for one email when we launch.</p>

      <form class="wl" id="wl">
        <label for="wl-email">Get one email when we launch</label>
        <input 
          type="email" 
          id="wl-email" 
          name="email" 
          placeholder="you@example.com" 
          autocomplete="email"
          required
        >
        <label class="consent">
          <input type="checkbox" name="consent" value="yes" required>
          <span>Yes, email me once when HatDat™ Pet Rescue goes live.</span>
        </label>

        <!-- Honeypot: hidden from people; bots may fill it in -->
        <div class="hp" aria-hidden="true">
          <label>
            Website
            <input name="website" tabindex="-1" autocomplete="off">
          </label>
        </div>

        <div 
          class="cf-turnstile" 
          data-sitekey="0x4AAAAAAFTzuwsBcyt67jVG" 
          data-theme="dark"
        ></div>

        <button type="submit" class="btn-teal" id="wl-send">
          Email Me on Launch
        </button>
        <p class="fine">Your email is not displayed publicly.</p>
        <div id="wl-msg" role="status" aria-live="polite"></div>
      </form>
      <button type="button" class="btn-close" id="close-soon">Close</button>
    </div>
  </dialog>

  <script>
    const API = "https://hatdat-pet-rescue-api.gracelibraryiea.workers.dev";
    const soon = document.getElementById("soon");

    // Animated border: builds two SVG paths sized to the element.
    const NS = "http://www.w3.org/2000/svg";
    function framePaths(w, h, r) {
      const i = 1;
      const x0 = i;
      const y0 = i;
      const x1 = w - i;
      const y1 = h - i;
      const m = w / 2;
      r = Math.min(r, (w - 2 * i) / 2, (h - 2 * i) / 2);
      return [
        `M${m},${y0} H${x0 + r} A${r},${r} 0 0 0 ${x0},${y0 + r} V${y1 - r} A${r},${r} 0 0 0 ${x0 + r},${y1} H${m}`,
        `M${m},${y0} H${x1 - r} A${r},${r} 0 0 1 ${x1},${y0 + r} V${y1 - r} A${r},${r} 0 0 1 ${x1 - r},${y1} H${m}`
      ];
    }

    function animateFrame(el) {
      el.querySelectorAll(":scope > .frame, :scope > .spark").forEach((node) => node.remove());

      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "frame");
      svg.setAttribute("aria-hidden", "true");

      const left = document.createElementNS(NS, "path");
      const right = document.createElementNS(NS, "path");
      left.setAttribute("class", "frame-line frame-left");
      right.setAttribute("class", "frame-line frame-right");
      left.setAttribute("pathLength", "1");
      right.setAttribute("pathLength", "1");

      svg.append(left, right);

      const spark = document.createElement("span");
      spark.className = "spark";
      spark.setAttribute("aria-hidden", "true");

      el.append(svg, spark);

      el._fit = () => {
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        svg.setAttribute("width", w);
        svg.setAttribute("height", h);
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        const [leftPath, rightPath] = framePaths(w, h, 8);
        left.setAttribute("d", leftPath);
        right.setAttribute("d", rightPath);
      };
      el._fit();

      if (!el._ro && "ResizeObserver" in window) {
        el._ro = new ResizeObserver(() => {
          if (el._fit) el._fit();
        });
        el._ro.observe(el);
      }
    }

    animateFrame(document.querySelector(".container"));

    document.getElementById("open-soon").addEventListener("click", () => {
      soon.showModal();
      animateFrame(soon);
    });

    document.getElementById("close-soon").addEventListener("click", () => {
      soon.close();
    });

    // Clicking outside the dialog closes it; Escape works natively.
    soon.addEventListener("click", (event) => {
      if (event.target === soon) soon.close();
    });

    const form = document.getElementById("wl");
    const msg = document.getElementById("wl-msg");
    const send = document.getElementById("wl-send");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      send.disabled = true;
      msg.className = "";
      msg.textContent = "Sending...";

      try {
        const response = await fetch(API + "/api/waitlist", {
          method: "POST",
          body: new FormData(form)
        });
        const data = await response.json();

        if (response.ok) {
          msg.className = "ok";
          msg.textContent = data.message || "You're on the list!";
          form.querySelectorAll("input, button").forEach((element) => {
            element.disabled = true;
          });
          return;
        }

        msg.className = "bad";
        msg.textContent = data.error || "Something went wrong. Please try again.";
      } catch {
        msg.className = "bad";
        msg.textContent = "Couldn't connect. Please try again in a moment.";
      }

      if (window.turnstile) turnstile.reset();
      send.disabled = false;
    });
  </script>
</body>
