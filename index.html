<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HatDat | Pet Registry & Audio</title>
    <style>
        :root {
            --bg: #0f0c0a;
            --surface: #1a1410;
            --card: #221c18;
            --border: #332a24;
            --gold: #d4a04a;
            --gold-light: #e8c87a;
            --teal: #6b9e8a;
            --teal-light: #8bb8a6;
            --text-light: #e8ddd0;
            --text-muted: #a09286;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            color: var(--gold);
            margin-top: 0;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-muted);
            line-height: 1.5;
        }

        .player-box {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .btn-teal {
            display: inline-block;
            background-color: var(--teal);
            color: var(--bg);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn-teal:hover {
            background-color: var(--teal-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HatDat Platform</h1>
        <p>Local-first data ownership and community infrastructure. Enjoy the broadcast stream below while we build out the pet registry.</p>
        
        <div class="player-box">
            <!-- Embed your Mixcloud or audio stream iframe here -->
            <iframe width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="https://www.mixcloud.com/widget/iframe/?hide_cover=1&light=0&feed="></iframe>
        </div>

        <a href="#registry" class="btn-teal">Access Pet Registry</a>
    </div>

</body>
</html>
